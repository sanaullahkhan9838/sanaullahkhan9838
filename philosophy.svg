<rect x="40" y="30" width="720" height="4" rx="2" fill="url(#g)"/>
<text x="40" y="82" font-size="36" font-weight="800" fill="#0F172A">My philosophy</text>
<text x="40" y="138" font-size="30" font-weight="800" fill="url(#g)">Every expert was once a beginner.</text>
<text x="40" y="180" font-size="30" font-weight="800" fill="url(#g)">Keep learning, keep building,</text>
<text x="40" y="222" font-size="30" font-weight="800" fill="url(#g)">never stop improving.</text>
<text x="40" y="278" font-size="20" fill="#5B6477">Learn something new every day. Turn knowledge into real</text>
<text x="40" y="310" font-size="20" fill="#5B6477">products. Treat errors as chances to learn.</text>

</svg>
