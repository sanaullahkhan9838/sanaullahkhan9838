<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 352" width="800" height="352" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F9B934"/><stop offset=".3" stop-color="#F58529"/><stop offset=".65" stop-color="#E1306C"/><stop offset="1" stop-color="#833AB4"/></linearGradient>
<linearGradient id="gt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E1306C"/><stop offset="1" stop-color="#833AB4"/></linearGradient>
<linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F9B934"/><stop offset=".3" stop-color="#F58529"/><stop offset=".65" stop-color="#E1306C"/><stop offset="1" stop-color="#833AB4"/></linearGradient>
<linearGradient id="gv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F9B934"/><stop offset=".35" stop-color="#F58529"/><stop offset=".7" stop-color="#E1306C"/><stop offset="1" stop-color="#833AB4"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF6DC"/><stop offset=".5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EDE5FB"/></linearGradient>
